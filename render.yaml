services:
  - type: web
    name: encuentro-juvenil
    env: node
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npx prisma db push && npm run build && cd ../client && npm install && npm run build && cd ..
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        value: file:./dev.db
